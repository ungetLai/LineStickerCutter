<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片去背工具</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="nav-menu">
        <a href="index.html">圖片分割工具</a>
        <a href="index2.html">圖片分割工具(批次多張)</a>
        <a href="index3.html" class="active">圖片去背工具</a>
    </nav>
    <div class="container">
        <h1>圖片去背工具</h1>
        <div class="upload-section">
            <div class="split-options">
                <label>
                    背景色：
                    <input type="color" id="bgColor" value="#00FF00">
                </label>
                <label>
                    容差值（0-255）：
                    <input type="number" id="tolerance" min="0" max="255" value="30">
                    <span style="font-size: 12px; color: #666;">較大的值會移除更多相似的顏色</span>
                </label>
            </div>
            <input type="file" id="imageInput" accept="image/*">
            <button id="removeButton">去背</button>
        </div>
        <div class="preview-section">
            <div class="original-image">
                <h2>原始圖片</h2>
                <img id="originalPreview" src="" alt="原始圖片預覽">
            </div>
            <div class="split-images">
                <h2>去背後的圖片</h2>
                <div class="result-container">
                    <canvas id="resultCanvas" style="max-width: 100%; border: 1px solid #ddd; background: repeating-conic-gradient(#ccc 0% 25%, white 0% 50%) 50% / 20px 20px;"></canvas>
                    <div style="margin-top: 10px;">
                        <a id="downloadLink" download="removed_bg.png" style="display: none;">
                            <button>下載去背圖片</button>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script3.js"></script>
</body>
</html>
